version: 2
updates:
  # This is a signer package — keep dependencies current.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      all:
        patterns: ["*"]
    # Major upgrades are breaking for a published SDK — take them as deliberate,
    # tested migrations rather than bundled auto-PRs (e.g. zod 3→4 + ts 5→6 +
    # vitest 2→4 grouped together fail CI). Minor + patch, incl. security, still flow.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
